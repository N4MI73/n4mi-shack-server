# Propagation Dashboard — docker-compose.yml
#
# Deployed via the NAS Portainer (http://192.168.6.29:9000), environment n4misrv:
#   Stacks -> Add stack -> Repository
#   Name:                 propdashboard
#   Repository URL:       https://github.com/N4MI73/n4mi-shack-server
#   Repository reference: refs/heads/main
#   Compose path:         dashboard/docker-compose.yml
#   Environment variables: none. (Until 2026-11-07 the dashboard polled
#   Tempest itself and needed TEMPEST_TOKEN; since Roadmap Stage 3 PropMon
#   does that. Remove TEMPEST_TOKEN from the Portainer stack and revoke that
#   token -- PropMon's own token is the only one now.)
#
# The image is built on GitHub by .github/workflows/build-images.yml and pulled
# from ghcr.io -- Portainer can't build images on an Agent environment (see the
# workflow file). To update: change code on GitHub, wait for the "Build images"
# run to go green (Actions tab, ~1 min), then "Pull and redeploy" the stack.
# pull_policy: always makes every redeploy fetch the newest image.
# Rollback: change :latest to an earlier :<short-sha> tag and redeploy.
#
# No persistent data: nothing under /srv/docker for this app, nothing to back up.
#
# Outbound (LAN only since 2026-11-07): PropMon on the NAS
# (http://192.168.6.29:8076/api/v2/conditions -- band ratings, solar data,
# NOAA scales and storm/tower status) and DXMon /api/adxo
# (http://192.168.6.29:8083). The browser still loads the HamQSL images and
# the KC2G map directly from the internet.

services:
  propdashboard:
    image: ghcr.io/n4mi73/propdashboard:latest
    pull_policy: always
    container_name: propdashboard
    restart: unless-stopped
    ports:
      - "8073:8073"
    environment:
      - TZ=America/New_York
      - PROPMON_URL=http://192.168.6.29:8076
