# PropMon -- propagation and tower-alert JSON service (NAS, port 8076)
#
# Deployed with Portainer: Stacks -> propmon (NAS environment) -> Repository
#   Repository URL:  https://github.com/N4MI73/n4mi-shack-server
#   Reference:       refs/heads/main
#   Compose path:    propmon/docker-compose.yml
#
# The image is built by GitHub Actions (.github/workflows/build-images.yml) and
# published to ghcr.io; Portainer only pulls it. pull_policy: always makes
# "Pull and redeploy" fetch the newest image.
#
# TEMPEST_TOKEN: set it in the Portainer stack's environment variables, never
# here. ${TEMPEST_TOKEN} passes that value into the container. (The old compose
# file hard-coded "TEMPEST_TOKEN=" as empty, which overrode the Portainer value.)
# Without a token PropMon still serves band data; tower alerts use NWS only.

services:
  propmon:
    image: ghcr.io/n4mi73/propmon:latest
    pull_policy: always
    container_name: propmon
    restart: unless-stopped
    ports:
      - "8076:8076"
    environment:
      - TEMPEST_TOKEN=${TEMPEST_TOKEN}
